services:
  db:
    image: postgres:16-alpine
    container_name: examguard-postgres
    restart: always
    environment:
      POSTGRES_USER: examguard_user
      POSTGRES_PASSWORD: examguard_password
      POSTGRES_DB: examguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U examguard_user -d examguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: examguard-backend
    restart: always
    env_file:
      - path: .env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql://examguard_user:examguard_password@db:5432/examguard_db
      FRONTEND_URL: http://localhost:3000
      JWT_SECRET_KEY: dev_jwt_secret_key_change_in_production
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: examguard-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
      - /app/.next_build

volumes:
  postgres_data:
